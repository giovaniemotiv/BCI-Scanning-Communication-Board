name: Build installers

# Builds unsigned macOS and Windows installers. Run it from the Actions tab, or
# push a v* tag to also attach the installers to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Needed by the release step below; GITHUB_TOKEN is read-only by default,
    # and a tag build that cannot write contents fails only at the last step,
    # after both platforms have already been built.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: EMOTIV-BCI-Board-macos-arm64
          - os: windows-latest
            label: Windows (x64)
            artifact: EMOTIV-BCI-Board-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than the newest: PyQt6, pyobjc and pywin32 all ship
          # wheels for it, so neither runner has to compile anything.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller packaging/BCIScanningBoard.spec --noconfirm

      # ---------------------------------------------------------------- macOS
      - name: Check the macOS bundle actually launches
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # There is no headless mode, so this only proves the bundle starts and
          # stays up — not that the UI rendered. It catches missing imports and
          # broken bundling, which is what this build gets wrong.
          "dist/EMOTIV BCI Board.app/Contents/MacOS/EMOTIV BCI Board" &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "bundle still running after 25s"
            kill $PID
          else
            echo "bundle exited early — build is broken"
            exit 1
          fi

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R "dist/EMOTIV BCI Board.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "EMOTIV BCI Board" \
            -srcfolder dmg -ov -format UDZO \
            "EMOTIV-BCI-Board-macos-arm64.dmg"

      # -------------------------------------------------------------- Windows
      - name: Check the Windows bundle actually launches
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist/EMOTIV BCI Board/EMOTIV BCI Board.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "bundle exited early (code $($p.ExitCode)) — build is broken"
            exit 1
          }
          Write-Host "bundle still running after 25s"
          Stop-Process -Id $p.Id -Force
        shell: pwsh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          # Inno Setup ships on the hosted runner image, but the path is not on
          # PATH and the image contents do change; install it if it is missing.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc"
            exit 1
          }
          & $iscc "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item installer\*.exe .
        shell: pwsh

      # --------------------------------------------------------------- Upload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.dmg
            EMOTIV-BCI-Board-Setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            EMOTIV-BCI-Board-Setup-*.exe
          body: |
            Unsigned builds — see the README for how to open them past
            Gatekeeper (macOS) and SmartScreen (Windows).
